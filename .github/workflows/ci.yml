name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Format
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needed on:"
            echo "$out"
            exit 1
          fi

      # main.go embeds frontend/dist; stub so go tools work without a full UI build.
      - name: Stub frontend embed assets
        run: |
          mkdir -p frontend/dist
          printf '%s\n' '<!doctype html><title>ci-stub</title>' > frontend/dist/index.html

      # Wails v3 Linux stack needs GTK4 + WebKitGTK 6.0 for CGO (main + terminal service).
      - name: Install Wails Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev lsof

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./internal/...

      # v2.4+ required for go1.25 (binary must be built with Go >= go.mod version).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=3m

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run knip
      - run: bun run format:check
      - run: bun run build
