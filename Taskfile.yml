version: "3"

vars:
  APP_NAME: "double-pane"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: "{{.WAILS_VITE_PORT | default 9245}}"
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: "{{.GOOS | default OS}}"

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  docker:ensure:
    summary: Ensures Docker Desktop is running and wails-cross image exists
    internal: true
    vars:
      # Wails expects 'wails-cross' for amd64, and 'wails-cross-arm64' for arm64.
      IMAGE_NAME: 'wails-cross{{if ne .LINUX_ARCH "amd64"}}-{{.LINUX_ARCH}}{{end}}'
      DOCKER_STAMP: "{{.ROOT_DIR}}/.task/docker-started-by-dist"
    cmds:
      - |
        set -euo pipefail
        STAMP="{{.DOCKER_STAMP}}"
        mkdir -p "{{.ROOT_DIR}}/.task"
        rm -f "$STAMP"

        # macOS only: GET /_ping. Restart only when the engine is wedged
        # (socket exists, ping 500/timeout after boot grace). No socket =
        # still starting — do not kill. Up to 5 restarts, 10s…50s wedge windows.
        last_launch=0
        BOOT_GRACE=60

        desktop_running() {
          pgrep -x "Docker Desktop" >/dev/null 2>&1
        }

        find_docker_sock() {
          host="${DOCKER_HOST:-}"
          case "$host" in
            unix://*)
              s="${host#unix://}"
              [ -S "$s" ] && printf '%s' "$s" && return 0
              return 1
              ;;
          esac
          for s in \
            "${HOME}/.docker/run/docker.sock" \
            /var/run/docker.sock \
            "${HOME}/Library/Containers/com.docker.docker/Data/docker.raw.sock"
          do
            [ -S "$s" ] && printf '%s' "$s" && return 0
          done
          return 1
        }

        ping_code() {
          sock=$(find_docker_sock) || return 1
          code=$(curl -sS -o /dev/null -w "%{http_code}" --unix-socket "$sock" --max-time 1 http://localhost/_ping 2>/dev/null) || true
          [ -n "$code" ] && [ "$code" != "000" ] && printf '%s' "$code"
        }

        docker_ready() {
          code=$(ping_code || true)
          [ "$code" = "200" ]
        }

        # ready | booting | wedged
        engine_state() {
          if ! find_docker_sock >/dev/null; then
            echo booting
            return 0
          fi
          code=$(ping_code || true)
          if [ "$code" = "200" ]; then
            echo ready
            return 0
          fi
          now=$(date +%s)
          if [ $((now - last_launch)) -lt "$BOOT_GRACE" ]; then
            echo booting
            return 0
          fi
          echo wedged
        }

        wait_until_engine() {
          max_secs="$1"
          attempt="$2"
          start=$(date +%s)
          wedge_start=0
          while true; do
            state=$(engine_state)
            if [ "$state" = "ready" ]; then
              return 0
            fi
            now=$(date +%s)
            elapsed=$((now - start))
            echo "=== Waiting for Docker engine /_ping [${state}] (${elapsed}s, try ${attempt}/5) ==="
            if [ "$state" = "wedged" ]; then
              if [ "$wedge_start" -eq 0 ]; then
                wedge_start=$now
              fi
              if [ $((now - wedge_start)) -ge "$max_secs" ]; then
                return 1
              fi
            else
              wedge_start=0
            fi
            sleep 1
          done
        }

        kill_docker_desktop() {
          pkill -TERM -f '^/Applications/Docker.app/' 2>/dev/null || true
          n=0
          while [ "$n" -lt 10 ] && pgrep -q -f '^/Applications/Docker.app/'; do
            sleep 0.5
            n=$((n + 1))
          done
          pkill -KILL -f '^/Applications/Docker.app/' 2>/dev/null || true
        }

        relaunch_docker() {
          echo "=== try $1/5: engine wedged for $2s — kill Docker Desktop, relaunch ==="
          kill_docker_desktop
          sleep 1
          open -a Docker
          last_launch=$(date +%s)
        }

        ensure_engine() {
          wait=10
          attempt=1
          while [ "$attempt" -le 5 ]; do
            if wait_until_engine "$wait" "$attempt"; then
              return 0
            fi
            if [ "$attempt" -eq 5 ]; then
              return 1
            fi
            relaunch_docker "$attempt" "$wait"
            attempt=$((attempt + 1))
            wait=$((wait + 10))
          done
          return 1
        }

        if docker_ready; then
          echo "=== Docker engine is healthy ==="
        elif [ "$(uname -s)" != "Darwin" ]; then
          echo "Starting Docker for dist is macOS-only for now. Start the daemon and re-run." >&2
          exit 1
        else
          if ! desktop_running; then
            echo "=== Docker Desktop is not running. Launching it. ==="
            open -a Docker
            last_launch=$(date +%s)
            touch "$STAMP"
          else
            echo "=== Docker Desktop is running — waiting for engine /_ping ==="
          fi
          rc=0
          ensure_engine || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "Docker engine still wedged after 5 restarts. Start Docker Desktop and re-run." >&2
            exit 1
          fi
          echo "=== Docker engine is healthy ==="
        fi

        # 2. Check if the specific architecture image exists
        IMG="{{.IMAGE_NAME}}"
        if ! docker image inspect "$IMG" >/dev/null 2>&1; then
          echo "=== Docker image '$IMG' not found. Building it now... ==="
          wails3 task setup:docker ARCH="{{.LINUX_ARCH}}"
        else
          echo "=== Docker image '$IMG' found! ==="
        fi

  docker:maybe-quit:
    summary: Quit Docker Desktop if docker:ensure started it for dist
    internal: true
    cmds:
      - |
        set -euo pipefail
        STAMP="{{.ROOT_DIR}}/.task/docker-started-by-dist"
        if [ ! -f "$STAMP" ]; then
          exit 0
        fi
        rm -f "$STAMP"
        if [ "$(uname -s)" != "Darwin" ]; then
          exit 0
        fi
        echo "=== Quitting Docker Desktop (started by this dist run) ==="
        pkill -TERM -f '^/Applications/Docker.app/' 2>/dev/null || true
        n=0
        while [ "$n" -lt 10 ] && pgrep -q -f '^/Applications/Docker.app/'; do
          sleep 0.5
          n=$((n + 1))
        done
        pkill -KILL -f '^/Applications/Docker.app/' 2>/dev/null || true

  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"
        vars:
          ARCH: "{{.ARCH}}"
          VERSION: "{{.VERSION}}"
          DEV: "{{.DEV}}"
          OUTPUT: "{{.OUTPUT}}"
          EXTRA_TAGS: "{{.EXTRA_TAGS}}"
          OBFUSCATED: "{{.OBFUSCATED}}"
          GARBLE_ARGS: "{{.GARBLE_ARGS}}"
          CGO_ENABLED: "{{.CGO_ENABLED}}"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"
        vars:
          ARCH: "{{.ARCH}}"
          VERSION: "{{.VERSION}}"
          DEV: "{{.DEV}}"

  # Local cross-compile helpers (see https://v3.wails.io/guides/build/cross-platform/)
  # One-time for non-native targets: wails3 task setup:docker
  build:windows:
    summary: Cross-build Windows (native Go; set CGO_ENABLED=1 for Docker CGO)
    cmds:
      - task: windows:build
        vars:
          ARCH: '{{.ARCH | default "amd64"}}'
          VERSION: "{{.VERSION}}"
          CGO_ENABLED: '{{.CGO_ENABLED | default "0"}}'

  build:linux:
    summary: Cross-build Linux (Docker on macOS/Windows uses gtk3; native Linux uses GTK4)
    desc: |
      From macOS/Windows: uses wails-cross Docker + gtk3 tag (image has GTK 4.8 only).
      From Linux with gcc: native GTK4 build.
      Example: task build:linux ARCH=arm64 VERSION=0.1.0
    cmds:
      - task: linux:build
        vars:
          ARCH: '{{.ARCH | default "amd64"}}'
          VERSION: "{{.VERSION}}"
          EXTRA_TAGS: "{{.EXTRA_TAGS}}"

  build:darwin:
    summary: Cross-build macOS binary only (Docker on Linux/Windows, native on macOS)
    desc: |
      Emits bin/double-pane (raw executable — Terminal icon in Finder).
      For an Applications-ready .app on macOS, use: task package:darwin
    cmds:
      - task: darwin:build
        vars:
          ARCH: "{{.ARCH | default ARCH}}"
          VERSION: "{{.VERSION}}"
      - cmd: 'echo "Tip: for Applications / Dock icon, run: wails3 package (or task package:darwin)"'
        platforms: [darwin]

  package:darwin:
    summary: Package macOS .app bundle (icon + Info.plist; drag to Applications)
    desc: |
      Builds then creates bin/double-pane.app with icons from build/appicon.png.
      Example: task package:darwin VERSION=0.1.0 ARCH=arm64
    cmds:
      - task: darwin:package
        vars:
          ARCH: "{{.ARCH | default ARCH}}"
          VERSION: "{{.VERSION}}"

  # Local multi-platform release archives (asset names the in-app updater matches).
  # Requires Docker image for Linux: task setup:docker
  dist:
    summary: Build darwin .app + windows + linux archives into dist/ for all platforms
    desc: |
      VERSION is required (injected into binaries and used in asset names).
      Defaults: darwin/arm64, windows/amd64, linux/<host arch>.
      Linux defaults to the host arch so Apple Silicon + host-built wails-cross works
      without QEMU. For CI-like linux/amd64 on arm64 Mac:
        task setup:docker ARCH=amd64 && task dist VERSION=0.1.0 LINUX_ARCH=amd64
      Example: task dist VERSION=0.1.0
      Upload dist/* with `task release:publish VERSION=0.1.0`,
      or add PUBLISH=true to tag/push/publish automatically once the build
      succeeds: task dist VERSION=0.1.0 PUBLISH=true (needs `gh auth login`).
    vars:
      DARWIN_ARCH: '{{.DARWIN_ARCH | default "arm64"}}'
      WINDOWS_ARCH: '{{.WINDOWS_ARCH | default "amd64"}}'
      # Host arch (Task ARCH) — arm64 on Apple Silicon, amd64 on Intel/x86_64 Linux.
      LINUX_ARCH: "{{.LINUX_ARCH | default ARCH}}"
      PUBLISH: '{{.PUBLISH | default "false"}}'
    preconditions:
      - sh: test -n "{{.VERSION}}"
        msg: "VERSION is required, e.g. task dist VERSION=0.1.0"
    cmds:
      - task: dist:maybe-clean
        vars:
          PUBLISH: "{{.PUBLISH}}"
      # Registered before docker:ensure runs, not after — so it still fires
      # (and cleans up Docker Desktop) even if docker:ensure itself fails,
      # e.g. its own start-wait times out. A defer registered as a later cmd
      # is never reached if an earlier cmd errors out first.
      - defer: { task: docker:maybe-quit }
      - task: docker:ensure
        vars:
          LINUX_ARCH: "{{.LINUX_ARCH}}"
      - task: dist:build
        vars:
          VERSION: "{{.VERSION}}"
          DARWIN_ARCH: "{{.DARWIN_ARCH}}"
          WINDOWS_ARCH: "{{.WINDOWS_ARCH}}"
          LINUX_ARCH: "{{.LINUX_ARCH}}"
      - task: dist:archive
        vars:
          VERSION: "{{.VERSION}}"
          DARWIN_ARCH: "{{.DARWIN_ARCH}}"
          WINDOWS_ARCH: "{{.WINDOWS_ARCH}}"
          LINUX_ARCH: "{{.LINUX_ARCH}}"
      # Only reached if dist:build/dist:archive above succeeded (Task stops
      # the cmds chain on first failure).
      - task: dist:maybe-publish
        vars:
          VERSION: "{{.VERSION}}"
          PUBLISH: "{{.PUBLISH}}"

  dist:maybe-clean:
    internal: true
    status:
      - '[ "{{.PUBLISH}}" != "true" ]'
    cmds:
      - rm -rf dist
      - mkdir -p dist

  dist:maybe-publish:
    internal: true
    # status (skip-if-true) is Task's native conditional-skip mechanism —
    # avoids shelling out to a nested `task`/`wails3 task` invocation, which
    # would need to know how *this* run was invoked.
    status:
      - '[ "{{.PUBLISH}}" != "true" ]'
    cmds:
      - task: release:publish
        vars:
          VERSION: "{{.VERSION}}"

  dist:build:
    summary: Compile all platform artifacts for dist/
    internal: true
    cmds:
      # Package .app first (embeds darwin binary under Contents/MacOS).
      - task: darwin:package
        vars:
          VERSION: "{{.VERSION}}"
          ARCH: "{{.DARWIN_ARCH}}"
      - task: windows:build
        vars:
          VERSION: "{{.VERSION}}"
          ARCH: "{{.WINDOWS_ARCH}}"
          CGO_ENABLED: "0"
      # Separate OUTPUT so we do not clobber the darwin bare binary path mid-run.
      - task: linux:build
        vars:
          VERSION: "{{.VERSION}}"
          ARCH: "{{.LINUX_ARCH}}"
          OUTPUT: "bin/double-pane-linux-{{.LINUX_ARCH}}"

  dist:archive:
    summary: Zip/tar built artifacts into dist/ with updater-compatible names
    internal: true
    cmds:
      - |
        set -euo pipefail
        VER="{{.VERSION}}"
        D_ARCH="{{.DARWIN_ARCH}}"
        W_ARCH="{{.WINDOWS_ARCH}}"
        L_ARCH="{{.LINUX_ARCH}}"
        LINUX_BIN="bin/double-pane-linux-${L_ARCH}"
        mkdir -p dist
        rm -f "dist/double-pane_${VER}_darwin_${D_ARCH}.zip" \
              "dist/double-pane_${VER}_darwin_${D_ARCH}.dmg" \
              "dist/double-pane_${VER}_windows_${W_ARCH}.zip" \
              "dist/double-pane_${VER}_linux_${L_ARCH}.tar.gz"

            # 1. Darwin (macOS)
            if [ ! -d "bin/double-pane.app" ]; then
              echo "Expected bin/double-pane.app (darwin package failed?)" >&2
              ls -la bin/ || true
              exit 1
            fi

            # Create standard zip
            (cd bin && zip -ry "../dist/double-pane_${VER}_darwin_${D_ARCH}.zip" double-pane.app)

            # Create DMG if on macOS and create-dmg is installed
            if [ "$(uname -s)" = "Darwin" ]; then
              if command -v create-dmg >/dev/null 2>&1; then
                echo "=== Generating macOS DMG ==="
                # 1. Clean up any previous DMG in bin/
                rm -f "bin/double-pane.dmg"

                # 2. Output the DMG directly to the bin/ folder
                create-dmg \
                  --volname "double-pane" \
                  --window-pos 200 120 \
                  --window-size 600 400 \
                  --icon-size 100 \
                  --icon "double-pane.app" 150 190 \
                  --app-drop-link 450 190 \
                  "bin/double-pane.dmg" \
                  "bin/double-pane.app"

                # 3. Copy the cleanly named bin file into dist/ with the version tags
                cp "bin/double-pane.dmg" "dist/double-pane_${VER}_darwin_${D_ARCH}.dmg"
              else
                echo "Notice: 'create-dmg' is not installed. Skipping .dmg creation."
                echo "To enable, run: brew install create-dmg"
              fi
            fi

            # 2. Windows
            if [ ! -f "bin/double-pane.exe" ]; then
              echo "Expected bin/double-pane.exe" >&2
              ls -la bin/ || true
              exit 1
            fi
            (cd bin && zip -9 "../dist/double-pane_${VER}_windows_${W_ARCH}.zip" double-pane.exe)

            # 3. Linux
            if [ ! -f "$LINUX_BIN" ]; then
              echo "Expected $LINUX_BIN" >&2
              ls -la bin/ || true
              exit 1
            fi

            # Archive member name must be double-pane (matches CI + updater docs).
            STAGE=$(mktemp -d)
            cp "$LINUX_BIN" "$STAGE/double-pane"
            tar -C "$STAGE" -czf "dist/double-pane_${VER}_linux_${L_ARCH}.tar.gz" double-pane
            rm -rf "$STAGE"

            # Checksums for Wails app.Updater (ChecksumAsset: SHA256SUMS).
            # Include only installable archives (not DMG — updater does not install .dmg).
            # Generate into a temp file first (do not pipe the loop — that runs it in a
            # subshell, so a found=1 flag would be lost), then sort.
            (
              cd dist
              rm -f SHA256SUMS
              sums=$(mktemp)
              found=0
              for f in *.zip *.tar.gz; do
                [ -f "$f" ] || continue
                found=1
                if command -v sha256sum >/dev/null 2>&1; then
                  sha256sum "$f"
                else
                  shasum -a 256 "$f"
                fi
              done > "$sums"
              if [ "$found" -eq 0 ]; then
                rm -f "$sums"
                echo "No dist archives for SHA256SUMS" >&2
                exit 1
              fi
              sort -k2 "$sums" > SHA256SUMS
              rm -f "$sums"
              echo "=== SHA256SUMS ==="
              cat SHA256SUMS
            )

            echo "=== dist/ ready ==="
            ls -lh dist/

  release:publish:
    summary: Tag, push, and publish an already-built dist/ as a GitHub Release
    desc: |
      Requires: `task dist VERSION=...` already run (dist/ populated), and
      `gh auth login`. Creates the GitHub Release from your machine (not CI).
      Example: task release:publish VERSION=0.1.0
    preconditions:
      - sh: test -n "{{.VERSION}}"
        msg: "VERSION is required, e.g. task release:publish VERSION=0.1.0"
      - sh: ls dist/*.zip dist/*.tar.gz >/dev/null 2>&1
        msg: "dist/ has no release archives — run `task dist VERSION={{.VERSION}}` first"
      - sh: test -f dist/SHA256SUMS
        msg: "dist/SHA256SUMS is missing — the in-app updater can't verify a release without it. Re-run `task dist VERSION={{.VERSION}}`."
      - sh: command -v gh >/dev/null 2>&1
        msg: "gh CLI not found — install it: https://cli.github.com"
      - sh: gh auth status >/dev/null 2>&1
        msg: "Not logged in — run `gh auth login` first"
      - sh: test -z "$(git status --porcelain)"
        msg: "Working tree is dirty — commit or stash before tagging a release (uncommitted changes wouldn't be in the tagged commit)."
      # NOT `sh: '! cmd'` — mvdan/sh (Task's embedded shell interpreter)
      # mishandles negating an EXTERNAL process's exit status: `! git ...`
      # reports failure to Task even when the negation should succeed
      # (verified directly — `! false` negates fine since it's a builtin,
      # but `! git bogus-subcommand` does not). A trailing `; test $? -ne 0`
      # doesn't work either — precondition scripts abort on the first
      # non-zero exit mid-script (implicit errexit), never reaching the
      # test. `cmd && exit 1 || exit 0` sidesteps both: no negation, and
      # `exit` here is a plain top-level statement, not inside a
      # condition, so it isn't hit by the separate exit-swallowing bug.
      - sh: 'git rev-parse --verify --quiet "refs/tags/v{{.VERSION}}" >/dev/null 2>&1 && exit 1 || exit 0'
        msg: "Tag v{{.VERSION}} already exists locally — bump VERSION or delete the tag first (git tag -d v{{.VERSION}})."
      - sh: 'git ls-remote --exit-code --tags origin "v{{.VERSION}}" >/dev/null 2>&1 && exit 1 || exit 0'
        msg: "Tag v{{.VERSION}} already exists on origin — bump VERSION."
    cmds:
      - |
        set -euo pipefail
        TAG="v{{.VERSION}}"
        git tag "$TAG"
        git push origin "$TAG"
        gh release create "$TAG" dist/* --title "$TAG" --generate-notes

  release:local:
    summary: Full local release — build dist/ then publish it as a GitHub Release
    desc: |
      One-shot local release: build dist/ then publish it as a GitHub Release.
      Alias for `task dist VERSION=... PUBLISH=true`.
      Example: task release:local VERSION=0.1.0
    preconditions:
      - sh: test -n "{{.VERSION}}"
        msg: "VERSION is required, e.g. task release:local VERSION=0.1.0"
    cmds:
      - task: dist
        vars:
          VERSION: "{{.VERSION}}"
          PUBLISH: "true"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  test:
    summary: Unit tests (Go)
    cmds:
      - go test ./internal/...

  ci:go:
    summary: Run Go CI steps in Docker (Linux + Wails GTK; mirrors .github/workflows/ci.yml)
    desc: |
      Requires Docker image wails-cross (task setup:docker).
      Reproduces gofmt, embed stub, go vet, go test, and golangci-lint on Linux.
    cmds:
      - bash ./scripts/ci-go-docker.sh

  lint:
    summary: Go + frontend lint/format/knip
    cmds:
      - |
        out=$(gofmt -l .)
        if [ -n "$out" ]; then
          echo "gofmt needed on:"
          echo "$out"
          exit 1
        fi
      - |
        if [ ! -f frontend/dist/index.html ]; then
          mkdir -p frontend/dist
          printf '%s\n' '<!doctype html><title>ci-stub</title>' > frontend/dist/index.html
        fi
      - go vet ./...
      - golangci-lint run --timeout=3m
      - task: frontend:lint

  frontend:lint:
    dir: frontend
    cmds:
      - npm run lint
      - npm run knip
      - npm run format:check

  check:
    summary: Full quality gate — lint, knip, Go tests (husky pre-push)
    desc: |
      Local CI-lite: gofmt, go vet, golangci-lint, go test, frontend tsc/oxlint, knip, oxfmt.
      No e2e, no production binary. Used by .husky/pre-push.
    cmds:
      - task: lint
      - task: test

  check:build:
    summary: Compile gate — frontend production build + Go binary (husky pre-commit)
    desc: |
      Verifies TypeScript/Vite and the Wails Go binary compile. Does not generate
      bindings, tidy modules, or run lint/tests. Used by .husky/pre-commit.
    cmds:
      - npm run build --prefix frontend
      - CGO_ENABLED=1 go build -tags production -o "{{.BIN_DIR}}/{{.APP_NAME}}"

  test:e2e:
    summary: Playwright e2e against Wails server mode
    dir: e2e
    cmds:
      - npm test

  test:all:
    summary: Full gate — unit + e2e + production build (run after big changes)
    cmds:
      - task: test
      - task: test:e2e
      - wails3 build

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
